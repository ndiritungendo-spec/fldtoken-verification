name: Verify Fluid Token Contract

on:
  workflow_dispatch: # allows manual triggering
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # Clean NPM cache (optional but recommended)
      - name: Clean NPM Cache
        run: npm cache clean --force

      # Install dependencies ignoring peer conflicts
    - name: Install dependencies
  run: |
    rm -rf node_modules package-lock.json
    npm install --legacy-peer-deps

      # Verify the contract on Polygon
      - name: Verify Fluid Token on Polygon
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: |
          npx hardhat verify --network polygon 0x482eE2E3F715e25d5231747de9e9A647Fc904512 "Fluid Token" "FLD"